# TODO(student) Exercise 4: write the code path. tests/test_workflows.py checks it.
# - Triggers: push and pull_request, each with a `paths:` filter for this lab and the
#   installed workflow file.
# - defaults.run.working-directory: this lab's folder, from the repository root.
# - Call make targets only, never src/main.py. Pin every action to a tag that exists.
# - The jobs and their steps:
#
#   lint
#     check out the code, set up uv, install the lint group, run the linter
#
#   test: a matrix over the layers unit, data and eval, with fail-fast off
#     check out the code, set up uv, install all groups, run this copy's layer
#
#   pipeline: needs lint and test
#     check out the code, set up uv, install all groups, then these named steps:
#     - "Rebuild the dataset"
#     - "validate -> prepare -> train -> evaluate -> gate": runs `make ci`
#     - "Publish the gate verdict to the job summary": writes `make gate-summary` to
#       $GITHUB_STEP_SUMMARY, also when an earlier step failed
#     - "Annotate a NO-GO": an ::error:: line, only when an earlier step failed
#     - "Upload the evidence": metrics/, reports/ and models/model.pkl, also when an
#       earlier step failed
#
# Reference: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Week 7 CI

on:
  push:
    paths:
      - "labs/week-07-ci-workflow/**"
      - ".github/workflows/week07-ci.yml"
  pull_request:
    paths:
      - "labs/week-07-ci-workflow/**"
      - ".github/workflows/week07-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: labs/week-07-ci-workflow/starter

env:
  # `uses:` steps ignore defaults.run.working-directory, so upload paths need the full path.
  LAB_DIR: labs/week-07-ci-workflow/starter

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install the lint group
        run: uv sync --group lint
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, data, eval]
    name: test (${{ matrix.layer }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install all groups
        run: make sync
      - name: Rebuild the dataset
        run: make data-v2
      - name: Run the ${{ matrix.layer }} layer
        run: make test-${{ matrix.layer }}

  pipeline:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install all groups
        run: make sync

      - name: Rebuild the dataset
        run: make data-v2

      - name: validate -> prepare -> train -> evaluate -> gate
        run: make ci

      - name: Publish the gate verdict to the job summary
        if: always()
        run: make gate-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate a NO-GO
        if: failure()
        run: echo "::error title=NO-GO::The pipeline or the gate refused this commit. Read the job summary and the uploaded reports."

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-evidence-${{ github.sha }}
          path: |
            ${{ env.LAB_DIR }}/metrics/
            ${{ env.LAB_DIR }}/reports/
            ${{ env.LAB_DIR }}/models/model.pkl
          if-no-files-found: warn
